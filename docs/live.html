<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동네컷 | 행사 영상 만들기</title><style>html,body{height:100%;margin:0;font:14px system-ui;background:#f5f7fa}header{height:48px;display:flex;align-items:center;gap:20px;padding:0 20px;border-bottom:1px solid #ddd;background:white}header a{color:#2563eb}iframe{width:100%;height:calc(100% - 49px);border:0}#notice{padding:24px;color:#52525b}</style><header><strong>동네컷</strong><a href="index.html">소개 및 결과 영상</a><a id="direct" hidden target="_blank" rel="noopener">새 창에서 만들기</a></header><p id="notice" role="status">시연 서버 연결을 확인하고 있어요.</p><iframe id="app" hidden title="동네컷 행사 선택 및 영상 생성" allow="autoplay; fullscreen"></iframe><script>
(async()=>{try{const r=await fetch('live-config.json',{cache:'no-store'});if(!r.ok)throw Error();const {url}=await r.json();const u=new URL(url);if(u.protocol!=='https:'||!u.hostname.endsWith('.trycloudflare.com'))throw Error();const link=document.getElementById('direct');link.href=u.href;link.hidden=false;const f=document.getElementById('app');f.src=u.href;f.hidden=false;document.getElementById('notice').hidden=true;}catch{document.getElementById('notice').textContent='시연 서버 연결을 준비 중이에요. 소개 페이지에서 완성 영상을 먼저 확인해 주세요.';}})();
</script></html>
